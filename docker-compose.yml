# Run n8n locally to import and execute workflows/mail-triage.json.
# Set ANTHROPIC_API_KEY in a local .env (next to this file) so the workflow's
# {{ $env.ANTHROPIC_API_KEY }} expression resolves inside n8n.
services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=Europe/Paris
      # Allow {{ $env.ANTHROPIC_API_KEY }} inside the workflow expressions.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./n8n_data:/home/node/.n8n

  # Local test mail server (SMTP + IMAP). Auth disabled: any user/password works,
  # nothing leaves the machine. The generator sends to it, n8n triages from it.
  greenmail:
    image: greenmail/standalone:2.1.0
    ports:
      - "3025:3025" # SMTP
      - "3143:3143" # IMAP
    environment:
      - >-
        GREENMAIL_OPTS=-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose
